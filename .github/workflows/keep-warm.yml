name: Keep backend warm

# Pings the backend's /health endpoint every 10 minutes so a serverless
# instance stays alive between real visitors, reducing (not eliminating —
# Vercel can still spin up a fresh instance under real concurrent load
# regardless) cold-start delay on the next real request. /health does no
# UCR or Redis work, so this never adds load to either.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf https://backend-eight-jade-57.vercel.app/health
